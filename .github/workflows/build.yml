name: Build installer

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Also publish a GitHub release with this tag (e.g. v2.0.1). Leave empty to only build.
        required: false
        default: ""
      release_name:
        description: Release title (defaults to the tag)
        required: false
        default: ""
      release_notes:
        description: Release notes
        required: false
        default: ""
      prerelease:
        description: Mark the release as a pre-release (nightly, not tested yet)
        type: boolean
        default: true

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Test
        working-directory: native
        run: cargo test
      - name: Build
        working-directory: native
        run: cargo build --release
      - name: Build installer
        shell: pwsh
        run: |
          $nsis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $nsis) {
            choco install nsis -y --no-progress
            $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          }
          & $nsis installer\wallpaper-switcher.nsi
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: wallpaper-switcher-setup
          path: installer/*.exe
      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          TITLE: ${{ inputs.release_name }}
          NOTES: ${{ inputs.release_notes }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $installer = Get-Item installer\*.exe
          Set-Content -Path release-notes.md -Value $env:NOTES -Encoding utf8
          $title = if ($env:TITLE) { $env:TITLE } else { $env:TAG }
          $release = @($env:TAG, $installer.FullName, '--target', $env:GITHUB_SHA, '--title', $title, '--notes-file', 'release-notes.md')
          if ($env:PRERELEASE -eq 'true') { $release += '--prerelease' }
          gh release create @release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
