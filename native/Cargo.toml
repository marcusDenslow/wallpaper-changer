[package]
name = "wallswitch"
version = "2.0.0"
description = "Wallpaper Switcher for Windows"
edition = "2021"
rust-version = "1.80"

[dependencies]
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.37", default-features = false }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
wgpu = { version = "30", default-features = false, features = ["dx12", "wgsl", "std"] }
egui-wgpu = { version = "0.37", default-features = false }
pollster = "0.4"
tray-icon = { version = "0.26", default-features = false }
global-hotkey = "0.9"
rfd = { version = "0.17", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
imagesize = "0.13"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_UI_Shell",
  "Win32_UI_Controls",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Foundation",
  "Storage",
  "Storage_Streams",
  "System",
  "System_UserProfile",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
